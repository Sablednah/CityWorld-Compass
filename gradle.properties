org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

parchment_minecraft_version=
parchment_mappings_version=

# What we BUILD against (one exact build) vs what the jar RUNS on (a range).
# The same NeoForge build CityWorld's line uses, so one dev server runs both.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.251
neo_version_range=[21.1,21.2)
loader_version_range=[1,)

# The CityWorld jar this builds against and runs beside (compileOnly; copied into run-mc26.2/mods for the dev
# server). It must carry CityWorldAPI.findables/find, i.e. CityWorld 6.6.0 or a dev build of master after 22e71719.
cityworld_jar=../../CityWorld-ReForged-worktrees/mc1.21.1/build/libs/cityworld-6.6.0+mc1.21.1.jar
cityworld_version_range=[6.6.0,)

# Dev server port. Not in the family table yet (Chronicler's CLAUDE.md); 25620 was free on 2026-10-16.
dev_server_port=25620

mod_id=cityworld_compass
mod_name=CityWorld Compass
mod_license=GPL-3.0-only
mod_version=1.0.0
mod_group_id=com.sablednah.cityworldcompass
mod_authors=Sablednah
mod_description=Nature's Compass for the city: pick a hospital, a mall, a subway station, a district or a named building, and the needle points to the nearest one. Needs CityWorld.
