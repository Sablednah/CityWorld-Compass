# CityWorld Compass — mods.toml (Forge 1.20.1: mandatory=true/false, not type=) (values are expanded from gradle.properties at build time).
# EDIT THIS TEMPLATE, never the generated copy under build/.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/CityWorld-Compass/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
# logoFile: the image in the mod info panel.
logoFile="cityworld_compass.png"
logoBlur=false

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The compass searches CityWorld's plan through its public API (CityWorldAPI.findables / find), added in 6.6.0.
[[dependencies.${mod_id}]]
    modId="cityworld"
    mandatory=true
    versionRange="${cityworld_version_range}"
    ordering="AFTER"
    side="BOTH"
